/* DeskOverlay Design System — tokens for quick access redesign */
:root {
  /* ── Semantic aliases (required by apply-html-head-contract.mjs) ── */
  --background: #0a0e15;
  --foreground: #e6edf3;
  --card: #141923;
  --card-foreground: #e6edf3;
  --popover: #1f2632;
  --popover-foreground: #e6edf3;
  --primary: #58a6ff;
  --primary-foreground: #061014;
  --muted: #1a1f2b;
  --muted-foreground: #9aa7b4;
  --border: rgba(255,255,255,0.10);
  --input: #111820;
  --ring: #58a6ff;
  --destructive: #ff7b72;
  --destructive-foreground: #061014;
  --secondary: #1a1f2b;
  --secondary-foreground: #9aa7b4;
  --accent: #39c5cf;
  --accent-foreground: #061014;

  /* ── Radius scale ── */
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 16px;
  --radius-xl: 18px;
  --radius-full: 9999px;

  /* ── DeskOverlay extended tokens ── */
  --bg-base: #0a0e15;
  --bg-panel: #141923;
  --bg-panel-2: #161b24;
  --bg-elevated: #1f2632;
  --bg-input: #111820;
  --bg-hover: rgba(255,255,255,0.06);
  --bg-hover-strong: rgba(255,255,255,0.10);

  --border-strong: rgba(255,255,255,0.18);
  --border-input: #2a3340;

  --text: #e6edf3;
  --text-dim: #9aa7b4;
  --text-faint: #5b6675;
  --text-invert: #061014;

  --blue: #58a6ff;
  --blue-rgb: 88,166,255;
  --green: #3fb950;
  --green-rgb: 63,185,80;
  --amber: #d29922;
  --amber-rgb: 210,153,34;
  --danger: #ff7b72;
  --danger-rgb: 255,123,114;
  --purple: #bc8cff;
  --purple-rgb: 188,140,255;
  --cyan: #39c5cf;

  --success: #3fb950;
  --warning: #d29922;
  --error: #ff7b72;
  --tomato: #ff7b72;

  /* Typography */
  --text-xs: 10px;
  --text-sm: 11px;
  --text-base: 13px;
  --text-md: 14px;
  --text-lg: 18px;
  --text-xl: 22px;
  --text-display: 48px;
  --lh-tight: 1.2;
  --lh-normal: 1.5;
  --lh-loose: 1.7;
  --fw-regular: 400;
  --fw-medium: 500;
  --fw-semibold: 600;
  --fw-bold: 700;

  /* Spacing (4px base) */
  --sp-1: 4px;
  --sp-2: 8px;
  --sp-3: 12px;
  --sp-4: 16px;
  --sp-5: 20px;
  --sp-6: 24px;
  --sp-8: 32px;

  /* Shadows */
  --shadow-xs: 0 1px 3px rgba(0,0,0,0.25);
  --shadow-sm: 0 4px 14px rgba(0,0,0,0.3);
  --shadow-soft: 0 8px 24px rgba(0,0,0,0.35);
  --shadow: 0 18px 50px rgba(0,0,0,0.45);
  --shadow-lg: 0 30px 80px rgba(0,0,0,0.6);

  /* Motion */
  --t-fast: 120ms ease;
  --t: 180ms cubic-bezier(0.22,0.61,0.36,1);
  --t-slow: 260ms ease;

  /* Layout */
  --nav-w: 240px;
  --font: "Segoe UI Variable", "Segoe UI", "Microsoft YaHei", "PingFang SC", Inter, system-ui, sans-serif;
  --font-mono: "Cascadia Mono", "JetBrains Mono", Consolas, monospace;

  /* Chart tokens */
  --chart-1: #58a6ff;
  --chart-2: #3fb950;
  --chart-3: #d29922;
  --chart-4: #bc8cff;
  --chart-5: #ff7b72;
}
