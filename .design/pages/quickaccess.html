  --accent: #39c5cf;

  --radius-sm: 6px;

  --radius-xl: 18px;

  --border-strong: rgba(255,255,255,0.18);

  --text: #e6edf3;
  --text-dim: #9aa7b4;
  --text-faint: #5b6675;
  --text-invert: #061014;

  --blue: #58a6ff;
  --blue-rgb: 88,166,255;
  --green: #3fb950;
  --green-rgb: 63,185,80;
  --amber: #d29922;
  --amber-rgb: 210,153,34;
  --danger: #ff7b72;
  --danger-rgb: 255,123,114;
  --purple: #bc8cff;
  --purple-rgb: 188,140,255;
  --cyan: #39c5cf;

  --success: #3fb950;
  --warning: #d29922;
  --error: #ff7b72;
  --tomato: #ff7b72;

  /* Typography */
  --text-xs: 10px;
  --text-sm: 11px;
  --text-base: 13px;
  --text-md: 14px;
  --text-lg: 18px;
  --text-xl: 22px;
  --text-display: 48px;
  --lh-tight: 1.2;
  --lh-normal: 1.5;
  --lh-loose: 1.7;
  --fw-regular: 400;
  --fw-medium: 500;
  --fw-semibold: 600;
  --fw-bold: 700;

  /* Spacing (4px base) */
  --sp-1: 4px;
  --sp-2: 8px;
  --sp-3: 12px;
  --sp-4: 16px;
  --sp-5: 20px;
  --sp-6: 24px;
  --sp-8: 32px;

  /* Shadows */
  --shadow-xs: 0 1px 3px rgba(0,0,0,0.25);
  --shadow-sm: 0 4px 14px rgba(0,0,0,0.3);
  --shadow-soft: 0 8px 24px rgba(0,0,0,0.35);
  --shadow: 0 18px 50px rgba(0,0,0,0.45);
  --shadow-lg: 0 30px 80px rgba(0,0,0,0.6);

  /* Motion */
  --t-fast: 120ms ease;
  --t: 180ms cubic-bezier(0.22,0.61,0.36,1);
  --t-slow: 260ms ease;

  /* Layout */
  --nav-w: 240px;
  --font: "Segoe UI Variable", "Segoe UI", "Microsoft YaHei", "PingFang SC", Inter, system-ui, sans-serif;
  --font-mono: "Cascadia Mono", "JetBrains Mono", Consolas, monospace;

  /* Chart tokens */
  --chart-1: #58a6ff;
  --chart-2: #3fb950;
  --chart-3: #d29922;
  --chart-4: #bc8cff;
  --chart-5: #ff7b72;
}

    <style>
      /* ── Quick access page — light polish on original structure ── */
      body {
        background: var(--background);
        color: var(--foreground);
        font-family: var(--font);
        padding: 24px 28px;
        min-height: 100vh;
        box-sizing: border-box;
      }
      main { max-width: 960px; margin: 0 auto; }

      /* Section title */
      .sec-title {
        display: flex; align-items: center; justify-content: space-between;
        font-size: 18px; font-weight: 600; color: var(--text);
        margin-bottom: 16px;
      }
      .qa-tools { display: inline-flex; align-items: center; gap: 6px; }

      /* Buttons */
      .btn-ghost {
        padding: 6px 12px; border-radius: 8px; border: 1px solid var(--border);
        background: transparent; color: var(--text-dim); font-size: 12px;
        font-family: var(--font); cursor: pointer;
        transition: all var(--t-fast);
      }
      .btn-ghost:hover { background: var(--bg-hover); color: var(--text); border-color: var(--border-strong); }
      .btn-primary {
        padding: 6px 14px; border-radius: 8px; border: none;
        background: linear-gradient(135deg, #2ea043, #238636);
        color: #fff; font-size: 12px; font-weight: 500;
        font-family: var(--font); cursor: pointer;
        transition: all var(--t-fast);
      }
      .btn-primary:hover { filter: brightness(1.12); }
      .btn-primary:active { transform: translateY(1px); }

      /* Groups */
      .qa-groups { display: flex; flex-direction: column; gap: 14px; }
      .qa-group-head {
        display: flex; align-items: center; gap: 6px;
        font-size: 11.5px; font-weight: 600; color: var(--text-dim);
        margin-bottom: 8px; letter-spacing: 0.3px;
        text-transform: uppercase;
      }
      .qa-count {
        font-size: 10px; color: var(--text-faint);
        background: rgba(255,255,255,0.08); padding: 1px 6px;
        border-radius: 8px; font-variant-numeric: tabular-nums;
      }
      .qa-row {
        display: flex; flex-wrap: wrap; gap: 8px;
        min-height: 66px; align-content: flex-start;
      }

      /* Cards — original layout with subtle polish */
      .qa-card {
        position: relative;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
        width: 118px; min-height: 64px; padding: 10px 6px;
        border-radius: 10px;
        background: var(--bg-panel-2);
        border: 1px solid var(--border);
        cursor: pointer; user-select: none; text-align: center; box-sizing: border-box;
        transition: border-color var(--t-fast), background var(--t-fast), transform var(--t-fast), box-shadow var(--t-fast);
      }
      .qa-card:hover {
        background: var(--bg-hover);
        border-color: rgba(88,166,255,0.35);
        transform: translateY(-1px);
        box-shadow: 0 4px 14px rgba(0,0,0,0.25);
      }

      /* Icon coloring by type — subtle tint */
      .qa-icon { display: flex; align-items: center; justify-content: center; }
      .qa-icon svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
      .qa-icon-url { color: var(--blue); }
      .qa-icon-folder { color: var(--amber); }
      .qa-icon-file { color: var(--green); }

      .qa-title {
        font-size: 11.5px; color: var(--text); max-width: 100%;
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      }

      /* Hover actions — same as original */
      .qa-actions {
        position: absolute; top: 6px; right: 6px;
        display: flex; align-items: center; gap: 2px; padding: 2px;
        background: var(--bg-elevated); border: 1px solid var(--border);
        border-radius: 8px; opacity: 0; transition: opacity var(--t-fast);
      }
      .qa-card:hover .qa-actions { opacity: 1; }
      .qa-act {
        width: 22px; height: 22px;
        display: inline-flex; align-items: center; justify-content: center;
        border: none; background: transparent; border-radius: 6px; color: var(--text-dim);
        cursor: pointer; padding: 0; transition: all var(--t-fast);
      }
      .qa-act svg { width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
      .qa-act:hover { background: var(--bg-hover); color: var(--blue); }
      .qa-act.danger:hover { background: rgba(255,123,114,0.16); color: var(--danger); }
    </style>
