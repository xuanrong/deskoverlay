<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>DeskOverlay 开发者工作台</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;
 width:100vw;height:100vh;
 overflow:hidden;
 background:#0b0f14;
 color:#e6edf3;
 font-family:"Microsoft YaHei",Inter,sans-serif;
}
.workspace{
 padding:32px;
 display:grid;
 grid-template-columns:260px 1fr 320px;
 gap:20px;
 height:100vh;
}
.card{
 background:rgba(255,255,255,.06);
 border:1px solid rgba(255,255,255,.1);
 border-radius:18px;
 padding:20px;
 backdrop-filter:blur(18px);
}
.sidebar h2{margin-top:0}
.menu div{
 padding:12px;
 margin:8px 0;
 border-radius:10px;
 cursor:pointer;
}
.menu div:hover{background:rgba(255,255,255,.08)}
.clock{
 font-size:42px;
 font-weight:700;
 margin:20px 0;
}
.task input{
 width:100%;
 background:#111820;
 border:1px solid #30363d;
 color:white;
 padding:10px;
 border-radius:8px;
}
button{
 background:#238636;
 border:0;
 color:white;
 padding:9px 14px;
 border-radius:8px;
 cursor:pointer;
}
.item{
 padding:12px 0;
 border-bottom:1px solid rgba(255,255,255,.08);
}
.done{text-decoration:line-through;opacity:.5}
.reminder{
 display:flex;
 justify-content:space-between;
 margin:12px 0;
}
.tag{
 color:#58a6ff;
}
</style>
</head>

<body>
<div class="workspace">

<div class="card sidebar">
<h2>DeskOverlay</h2>
<div class="menu">
<div>🏠 工作台</div>
<div>💻 开发项目</div>
<div>📝 速记</div>
<div>✅ 待办任务</div>
<div>⏰ 提醒中心</div>
</div>
</div>


<div>

<div class="card">
<div>早上好，开发者</div>
<div class="clock" id="clock"></div>
<div>当前模式：<span class="tag">Coding Mode</span></div>
</div>

<br>

<div class="card">
<h2>今日待办</h2>

<div class="task">
<input id="taskInput" placeholder="输入新的开发任务">
<button onclick="addTask()">添加</button>
</div>

<div id="tasks"></div>

</div>

<br>

<div class="card">
<h2>开发项目状态</h2>
<div class="item">项目：用户中心 API</div>
<div class="item">Git：main ✓ clean</div>
<div class="item">Build：成功</div>
<div class="item">Server：运行中</div>
</div>

</div>


<div>

<div class="card">
<h2>提醒</h2>

<div class="reminder">
<span>💧 喝水</span>
<span>11:30</span>
</div>

<div class="reminder">
<span>📅 产品会议</span>
<span>14:00</span>
</div>

<div class="reminder">
<span>🏢 下班打卡</span>
<span>18:30</span>
</div>

<button onclick="alert('开始专注 45 分钟')">
开始专注
</button>

</div>

<br>

<div class="card">
<h2>快速速记</h2>
<textarea id="note" style="width:100%;height:160px;background:#111820;color:white;border:1px solid #30363d;border-radius:8px;padding:10px" placeholder="记录灵感、Bug、想法..."></textarea>
</div>

</div>

</div>


<script>
function updateClock(){
 document.getElementById("clock").innerText=
 new Date().toLocaleTimeString("zh-CN",{hour12:false});
}
setInterval(updateClock,1000);
updateClock();

function addTask(){
 let input=document.getElementById("taskInput");
 if(!input.value)return;

 let div=document.createElement("div");
 div.className="item";
 div.innerHTML="□ "+input.value;
 div.onclick=function(){
   div.classList.toggle("done");
 };
 document.getElementById("tasks").appendChild(div);
 input.value="";
}
</script>

</body>
</html>
