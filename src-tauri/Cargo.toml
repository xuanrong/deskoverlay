[package]
name = "deskoverlay"
version = "0.3.0"
description = "DeskOverlay — Windows 桌面工作台 (Tauri + WebView2 承载层)"
authors = ["DeskOverlay"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
# 系统原生文件选择对话框：用于「设置 → 插件」选择外部插件文件
tauri-plugin-dialog = "2"
# 嵌入式 WebAssembly 运行时：加载外部插件的 Rust→wasm 后端（无需 dll，宿主内沙箱执行）。
# 用轻量解释器 wasmi（特性简单、依赖小），对插件轻量后端足够。
wasmi = { version = "0.31", default-features = false, features = ["std"] }
# 解压外部「插件包」(zip)：宿主读取 manifest + 前端 + 后端源码
zip = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.32", features = ["network", "disk"] }
# HTTP 代理：为音乐音源插件提供无 CORS 请求能力（get/post）；json 特性供阿里云盘 OpenAPI 调用
ureq = { version = "2", features = ["json"] }
# SHA1：阿里云盘上传秒传/秒传探测的内容哈希（上传 create 接口要求）
sha1_smol = "1"
# 音频元数据解析：ID3(mp3)/Vorbis(flac) 内嵌歌词与封面提取（云盘歌曲元数据来源）
lofty = "0.22"
# 响应字节解码：gzip 魔数强制解压（部分服务器无视协商头硬性压缩）
flate2 = "1"
# 非 UTF-8 响应字符集解码（GBK 等中文站点常态），配合 http_get 文本通道
encoding_rs = "0.8"
# 图片缩略图：桌面文件中心把图片读成 base64 data URL
base64 = "0.22"
# 位图解码缩放：缩略图先缩到最长边 128px 再编码（按需特性，控制依赖体积）
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "ico"] }
# windows-core 作为直接依赖，便于使用其导出的 `w!` 宽字符串宏
# （windows::core 系 windows_core 的别名，但 macro 经该别名导入不稳定）。
windows-core = "0.61"

# Win32 API（桌面注入 / 选择性穿透）。windows-rs 0.61 —— 版本必须与 Tauri 依赖的
# windows 主版本一致，否则会出现两个 windows crate 共存、HWND 等类型跨版本不匹配。
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_SystemInformation",
  "Win32_System_Power",
  "Win32_System_Com",
  "Win32_System_Ioctl",
  "Win32_System_IO",
  "Win32_Media_Audio",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  # 全局护眼：SetDeviceGammaRamp / GetDeviceGammaRamp 位于 UI::ColorSystem 模块
  "Win32_UI_ColorSystem",
  # 全局护眼时段模式：GetTimeZoneInformation 读本地时区偏移
  "Win32_System_Time",
  "Win32_Storage_FileSystem",
  # 开机自启：HKCU Run 注册表键（autostart.rs）
  "Win32_System_Registry",
  # 单实例互斥量：防「开机自启 + 手动启动」双实例重复嵌入桌面
  "Win32_System_Threading",
] }
