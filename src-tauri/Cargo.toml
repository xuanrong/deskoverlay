[package]
name = "deskoverlay"
version = "0.3.0"
description = "DeskOverlay — Windows 桌面工作台 (Tauri + WebView2 承载层)"
authors = ["DeskOverlay"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# 系统原生文件选择对话框：用于「设置 → 插件」选择外部插件文件
tauri-plugin-dialog = "2"
# 嵌入式 WebAssembly 运行时：加载外部插件的 Rust→wasm 后端（无需 dll，宿主内沙箱执行）。
# 用轻量解释器 wasmi（特性简单、依赖小），对插件轻量后端足够。
wasmi = { version = "0.31", default-features = false, features = ["std"] }
# 解压外部「插件包」(zip)：宿主读取 manifest + 前端 + 后端源码
zip = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.32", features = ["network", "disk"] }
# HTTP 代理：为音乐音源插件提供无 CORS 请求能力（get/post）
ureq = "2"
# 图片缩略图：桌面文件中心把图片读成 base64 data URL
base64 = "0.22"
# windows-core 作为直接依赖，便于使用其导出的 `w!` 宽字符串宏
# （windows::core 系 windows_core 的别名，但 macro 经该别名导入不稳定）。
windows-core = "0.61"

# Win32 API（桌面注入 / 选择性穿透）。windows-rs 0.61 —— 版本必须与 Tauri 依赖的
# windows 主版本一致，否则会出现两个 windows crate 共存、HWND 等类型跨版本不匹配。
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_SystemInformation",
  "Win32_System_Power",
  "Win32_System_Com",
  "Win32_Media_Audio",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
] }
