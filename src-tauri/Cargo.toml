[package]
name = "deskoverlay"
version = "0.3.0"
description = "DeskOverlay — Windows 桌面工作台 (Tauri + WebView2 承载层)"
authors = ["DeskOverlay"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
# 系统原生文件选择对话框：备份导出/恢复、选择背景图等
tauri-plugin-dialog = "2"
# 解压备份包(zip)
zip = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.32", features = ["network", "disk"] }
# HTTP 代理：为音乐音源插件提供无 CORS 请求能力（get/post）；json 特性供阿里云盘 OpenAPI 调用
ureq = { version = "2", features = ["json"] }
# SHA1：阿里云盘上传秒传/秒传探测的内容哈希（上传 create 接口要求）
sha1_smol = "1"
# 音频元数据解析：ID3(mp3)/Vorbis(flac) 内嵌歌词与封面提取（云盘歌曲元数据来源）
lofty = "0.22"
# 响应字节解码：gzip 魔数强制解压（部分服务器无视协商头硬性压缩）
flate2 = "1"
# 非 UTF-8 响应字符集解码（GBK 等中文站点常态），配合 http_get 文本通道
encoding_rs = "0.8"
# 图片缩略图：桌面文件中心把图片读成 base64 data URL
base64 = "0.22"
# 位图解码缩放：缩略图先缩到最长边 128px 再编码（按需特性，控制依赖体积）
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "ico"] }
# windows-core 作为直接依赖，便于使用其导出的 `w!` 宽字符串宏
# （windows::core 系 windows_core 的别名，但 macro 经该别名导入不稳定）。
windows-core = "0.61"

# Win32 API（桌面注入 / 选择性穿透）。windows-rs 0.61 —— 版本必须与 Tauri 依赖的
# windows 主版本一致，否则会出现两个 windows crate 共存、HWND 等类型跨版本不匹配。
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_SystemInformation",
  "Win32_System_Power",
  "Win32_System_Com",
  "Win32_System_Ioctl",
  "Win32_System_IO",
  "Win32_Media_Audio",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  # 全局护眼：SetDeviceGammaRamp / GetDeviceGammaRamp 位于 UI::ColorSystem 模块
  "Win32_UI_ColorSystem",
  # 全局护眼时段模式：GetTimeZoneInformation 读本地时区偏移
  "Win32_System_Time",
  "Win32_Storage_FileSystem",
  # 开机自启：HKCU Run 注册表键（autostart.rs）
  "Win32_System_Registry",
  # 单实例互斥量：防「开机自启 + 手动启动」双实例重复嵌入桌面
  "Win32_System_Threading",
  # 外设状态（peripheral.rs）：
  #   - GetRawInputDeviceList 在 UI::Input 顶层（父 feature Win32_UI_Input
  #     已由 Win32_UI_Input_KeyboardAndMouse 传递启用，这里无需重复列出）
  #   - PKEY_Device_FriendlyName 位于 Devices::FunctionDiscovery
  "Win32_Devices_FunctionDiscovery",
  # SetupAPI：枚举鼠标/键盘类设备并读 SPDRP_REMOVAL_POLICY 区分内置与外接
  "Win32_Devices_DeviceAndDriverInstallation",
  # HID 描述符：读 UsagePage/Usage 判断鼠标接口是真外设还是厂商自定义集合
  "Win32_Devices_HumanInterfaceDevice",
  # 外设电量：CM_Get_DevNode_PropertyW 读 DEVPKEY_Device_BatteryLevel，
  # 它的 propertytype 参数类型 DEVPROPTYPE 由本 feature 门控。
  # ⚠️ 这是**必需**功能依赖，不是随手加的（AGENTS-archive 里"别随手加 feature"
  #    指的是为了一行代码塞进整个 Win32 模块；这里换来的是键鼠/耳机电量显示）。
  "Win32_Devices_Properties",
  # 音频端点属性读取：IPropertyStore 在 UI::Shell::PropertiesSystem
  "Win32_UI_Shell_PropertiesSystem",
  # PROPVARIANT 的 vt/uintVal 字段受 Win32_System_Variant 门控
  "Win32_System_Variant",
  # 外设属性值释放：PropVariantClear / PropVariantToStringAlloc
  "Win32_System_Com_StructuredStorage",
] }

# 定时任务调度（scheduler.rs）：对外统一用 Unix 5 段 cron（分 时 日 月 周），
# 由 parse_schedule 转换成本 crate 的 6 段语法（秒开头、星期 1=周日）再求下次触发时刻。
# 本地时区换算依赖 chrono（此前已是传递依赖，这里提升为直接依赖以便显式使用）。
cron = "0.12"
chrono = "0.4"

# ── EMS 工作量抓取（ems.rs）的密码学依赖 ──────────────────────────────
# EMS 前端对每个请求体做「AES-128-CBC(ZeroPadding) + RSA-512(PKCS#1 v1.5) 包裹
# 会话密钥」，响应再以同一把 AES 密钥解回来。以下三个 crate 用来在 Rust 侧
# 原样复刻这套协议，避免依赖外部 Node 进程（打包后的桌面端没有 node）。
#
# aes：AES-128 分组密码本体（CBC 链式与 ZeroPadding 由 ems.rs 手工实现，
#      这样 padding 语义完全可控 —— EMS 用的是补 0x00 而非 PKCS#7）。
aes = "0.8"
# md-5：登录接口的密码字段要求发送 MD5 摘要（明文绝不上线）。
md-5 = "0.10"
# num-bigint：RSA 公钥只有 512 位（64 字节模长），ring 等库最低要求 2048 位，
# 无法使用；这里直接用大整数做 modpow 完成 PKCS#1 v1.5 加密。
num-bigint = "0.4"
