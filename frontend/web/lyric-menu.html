<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="./favicon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>桌面歌词设置</title>
  <style>
    /* 桌面歌词设置弹窗（独立窗口）：内容 = 设置菜单本体。
       弹窗尺寸固定（Rust 侧 MENU_W/H），菜单占满弹窗 —— 打开/关闭只是窗口显示/隐藏，
       歌词条窗口不做任何尺寸变化，从机制上杜绝闪烁。 */
    :root {
      --bg-base-default: #1A1B1D; --bg-base-secondary: #222427;
      --text-default: #D1D3DB; --text-secondary: #9599A6; --text-tertiary: #666B75;
      --bg-brand: #32F08C;
      --border-neutral-l1: rgba(224,226,242,0.1);
      --radius-6: 6px; --radius-8: 8px; --radius-10: 10px;
    }
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      background: transparent;
      overflow: hidden;
      font-family: "SF Pro Text", "Microsoft YaHei UI", system-ui, -apple-system, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }
    /* 菜单卡片：占满弹窗。纵向列表（主菜单）+ 右侧飞出子菜单（网易云布局）。 */
    .ly-panel {
      display: flex; align-items: flex-start;
      width: 100%; height: 100%;
      box-sizing: border-box;
      position: relative;
      padding: 6px;
      background: rgba(24, 25, 28, 0.86);
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: var(--radius-10);
      box-shadow: 0 6px 24px rgba(0,0,0,0.28), 0 1px 4px rgba(0,0,0,0.20);
      backdrop-filter: blur(20px) saturate(1.4);
      -webkit-backdrop-filter: blur(20px) saturate(1.4);
    }
    .ly-menu { width: 176px; display: flex; flex-direction: column; }
    .ly-sub {
      position: absolute;
      top: 6px; left: calc(176px + 18px);
      width: calc(100% - 176px - 30px);
      display: flex; flex-direction: column;
      padding: 2px;
      box-sizing: border-box;
    }
    /* 关键：display:flex 会覆盖 UA 对 [hidden] 的 display:none，
       不补这条的话子菜单会全部同时渲染、绝对定位叠在同一区域（内容重叠） */
    .ly-sub[hidden] { display: none; }
    /* 配色子菜单：2 列网格（9 项 → 5 行） */
    #sub-color {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 2px 6px;
      align-content: start;
    }
    /* ID 选择器优先级高于 .ly-sub[hidden]，必须单独补一条，否则配色网格收不起来 */
    #sub-color[hidden] { display: none; }
    .ly-mi {
      display: flex; align-items: center; gap: 8px;
      padding: 6px 10px;
      border: none; background: transparent;
      border-radius: var(--radius-6);
      color: var(--text-default);
      font-family: inherit; font-size: 12px; line-height: 1.3;
      cursor: pointer; white-space: nowrap; text-align: left;
      transition: background 120ms ease, color 120ms ease;
    }
    .ly-mi:hover { background: rgba(255,255,255,0.09); color: #F5F9FE; }
    .ly-caret { margin-left: auto; opacity: .5; font-size: 11px; }
    .ly-mcheck { margin-left: auto; color: var(--bg-brand); font-weight: 600; min-width: 14px; text-align: right; }
    .ly-mi.selected { background: rgba(50,240,140,0.10); }
    .ly-mi.active { color: #F5F9FE; }
    .ly-mi.active .ly-caret { opacity: .9; }
    /* 时间偏移行：非可点行（去 hover），± 步进微调 */
    .ly-mrow { cursor: default; }
    .ly-mrow:hover { background: transparent; }
    .ly-mlabel { color: #A8ADB8; }
    .ly-mspring { flex: 1 1 auto; }
    .ly-pval {
      min-width: 40px; text-align: center;
      font-size: 12px; color: var(--text-default);
      font-variant-numeric: tabular-nums;
    }
    .ly-panel .ly-btn {
      width: 22px; height: 22px; font-size: 12px;
      display: inline-flex; align-items: center; justify-content: center;
      background: transparent; border: none;
      color: var(--text-secondary);
      border-radius: var(--radius-6);
      cursor: pointer; padding: 0; line-height: 1;
      font-family: inherit;
      transition: background 120ms ease, color 120ms ease;
    }
    .ly-panel .ly-btn:hover { background: rgba(255,255,255,0.10); color: #F5F9FE; }
    .ly-panel .ly-btn:active { transform: scale(0.92); }
    /* 配色行：行首双色圆点（左上未唱色 / 右下已唱色），行尾 ✓ 标当前方案 */
    .ly-cdot {
      width: 12px; height: 12px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,.30);
      flex: 0 0 auto;
      background: linear-gradient(135deg, var(--sw-a, #F5F9FE) 0 50%, var(--sw-b, var(--bg-brand)) 50% 100%);
    }
  </style>
</head>
<body>
  <div class="ly-panel" id="panel">
    <div class="ly-menu">
      <div class="ly-mi ly-mrow">
        <span class="ly-mlabel">时间偏移</span>
        <span class="ly-mspring"></span>
        <button class="ly-btn" id="off-minus" title="延后 0.5 秒">−</button>
        <span class="ly-pval" id="off-val">同步</span>
        <button class="ly-btn" id="off-plus" title="提前 0.5 秒">＋</button>
      </div>
      <button class="ly-mi" id="mi-form" title="切换单行 / 双行（双行多显示下一句）">切换单行模式</button>
      <button class="ly-mi" id="mi-style" title="描边 / 胶囊 / 加粗">视觉样式<span class="ly-caret">›</span></button>
      <button class="ly-mi" id="mi-align">对齐方式<span class="ly-caret">›</span></button>
      <button class="ly-mi" id="mi-color">更换配色<span class="ly-caret">›</span></button>
    </div>
    <div class="ly-sub" id="sub-style" hidden>
      <button class="ly-mi" data-v="stroke">描边<span class="ly-mcheck"></span></button>
      <button class="ly-mi" data-v="capsule">胶囊<span class="ly-mcheck"></span></button>
      <button class="ly-mi" data-v="bold">加粗<span class="ly-mcheck"></span></button>
    </div>
    <div class="ly-sub" id="sub-align" hidden>
      <button class="ly-mi" data-v="left">左对齐<span class="ly-mcheck"></span></button>
      <button class="ly-mi" data-v="center">居中<span class="ly-mcheck"></span></button>
      <button class="ly-mi" data-v="right">右对齐<span class="ly-mcheck"></span></button>
    </div>
    <!-- 配色子菜单：一行 = 一个方案（双色圆点 + 名称 + ✓），由 JS 渲染 -->
    <!-- 配色子菜单：默认收起（点「更换配色」展开），内容由 JS 渲染 -->
    <div class="ly-sub" id="sub-color" hidden></div>
  </div>
  <script src="./js/lyric-menu.js"></script>
  <script type="module">
    import { applyThemeSnapshot } from "./js/theme.js";
    applyThemeSnapshot(document).catch((e) => console.warn("[menu] 主题快照失败", e));
  </script>
</body>
</html>
