<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>已锁定</title>
  <style>
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; font-family: "Microsoft YaHei UI", "Segoe UI", sans-serif;
      user-select: none; background: #05070a;
    }
    .lock-universe {
      position: fixed; inset: 0;
      background:
        radial-gradient(circle at 50% 50%, rgba(30, 45, 72, 0.55) 0%, rgba(8, 12, 20, 0.95) 55%, #020305 100%);
      overflow: hidden;
    }
    #sky {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      display: block;
    }
    .sun-wrap {
      position: absolute;
      left: 50%; top: 50%;
      translate: -50% -50%;
      z-index: 10;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .sun {
      width: 15vmin; height: 15vmin;
      min-width: 96px; min-height: 96px;
      border-radius: 50%;
      background:
        radial-gradient(circle at 35% 35%, #fff7d1 0%, #ffcc33 25%, #ff9933 55%, #c44e1c 100%);
      box-shadow:
        0 0 40px 8px rgba(255, 180, 60, 0.55),
        0 0 90px 24px rgba(255, 130, 30, 0.28),
        inset -8px -8px 30px rgba(120, 40, 10, 0.45);
      animation: sunPulse 3.2s ease-in-out infinite alternate;
      transition: filter 0.2s ease, box-shadow 0.2s ease;
    }
    .sun-wrap:hover .sun {
      filter: brightness(1.15);
      box-shadow:
        0 0 55px 14px rgba(255, 190, 70, 0.7),
        0 0 120px 36px rgba(255, 140, 40, 0.38),
        inset -8px -8px 30px rgba(120, 40, 10, 0.45);
    }
    .sun-wrap:active .sun { filter: brightness(0.95); }
    @keyframes sunPulse {
      0% { transform: scale(1); filter: brightness(1); }
      100% { transform: scale(1.04); filter: brightness(1.1); }
    }
    .lock-hint {
      position: absolute;
      left: 50%; bottom: 7vh;
      translate: -50% 0;
      text-align: center;
      color: rgba(230, 237, 243, 0.8);
      pointer-events: none;
      z-index: 10;
    }
    .lock-hint h1 {
      margin: 0;
      font-size: clamp(18px, 2.4vmin, 28px);
      font-weight: 700;
      letter-spacing: 1px;
      text-shadow: 0 2px 14px rgba(0,0,0,0.6);
    }
  </style>
</head>
<body>
  <div class="lock-universe">
    <canvas id="sky"></canvas>
    <div class="sun-wrap" id="sunUnlock" role="button" aria-label="解锁">
      <div class="sun"></div>
    </div>
    <div class="lock-hint">
      <h1>离开一会儿，马上回来</h1>
    </div>
  </div>
  <script src="./js/lockpage.js"></script>
</body>
</html>
