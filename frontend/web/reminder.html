<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="./favicon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>提醒</title>
  <style>
    /* TraeCode Design tokens — inlined for standalone Tauri window */
    :root {
      --bg-base-default: #1A1B1D; --bg-base-secondary: #222427;
      --text-default: #D1D3DB; --text-secondary: #9599A6; --text-tertiary: #666B75;
      --text-onbrand: #0C0C0D;
      --bg-brand: #32F08C; --bg-brand-hover: #0FDC78;
      --bg-brand-popup: rgba(50,240,140,0.12);
      --border-neutral-l1: rgba(224,226,242,0.1);
      --border-neutral-l2: rgba(224,226,242,0.16);
      --status-primary-default: #387BFF;
      --status-primary-surface-l1: rgba(53,121,255,0.18);
      --status-alert-default: #D29D00;
      --status-alert-surface-l1: rgba(210,157,0,0.16);
      --status-warning-default: #D27E24;
      --radius-4: 4px; --radius-6: 6px; --radius-8: 8px; --radius-10: 10px;
      --radius-full: 9999px;
      --spacer-4: 4px; --spacer-6: 6px; --spacer-12: 12px;
      --spacer-16: 16px;
    }
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      background: transparent;
      overflow: hidden;
      font-family: "SF Pro Text", "Microsoft YaHei UI", system-ui, -apple-system, sans-serif;
      user-select: none;
    }
    #card {
      position: absolute;
      inset: 8px;
      overflow: hidden;
      border-radius: var(--radius-10);
      background: rgba(34, 36, 39, 0.98);
      border: 1px solid var(--border-neutral-l2);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.05);
      backdrop-filter: blur(28px) saturate(1.2);
      -webkit-backdrop-filter: blur(28px) saturate(1.2);
      opacity: 0;
      transform: translateY(-12px) scale(0.98);
      transition: opacity 400ms cubic-bezier(0.22, 0.61, 0.36, 1),
                  transform 400ms cubic-bezier(0.22, 0.61, 0.36, 1);
    }
    #card.show { opacity: 1; transform: translateY(0) scale(1); }

    .rm-inner {
      padding: 14px 16px 12px;
    }
    .rm-top {
      display: flex;
      align-items: center;
      gap: var(--spacer-12);
    }
    .rm-icon {
      flex: 0 0 auto;
      width: 36px; height: 36px;
      border-radius: var(--radius-8);
      display: flex; align-items: center; justify-content: center;
      line-height: 0;
    }
    #card[data-type="water"] .rm-icon {
      background: var(--bg-brand-popup);
      box-shadow: inset 0 0 0 1px rgba(50,240,140,0.15);
    }
    #card[data-type="water"] .rm-icon svg { color: var(--bg-brand); }
    #card[data-type="sedentary"] .rm-icon {
      background: var(--status-alert-surface-l1);
      box-shadow: inset 0 0 0 1px rgba(210,157,0,0.15);
    }
    #card[data-type="sedentary"] .rm-icon svg { color: var(--status-alert-default); }
    #card[data-type="pomodoro"] .rm-icon {
      background: rgba(210,126,36,0.16);
      box-shadow: inset 0 0 0 1px rgba(210,126,36,0.15);
    }
    #card[data-type="pomodoro"] .rm-icon svg { color: var(--status-warning-default); }
    #card[data-type="general"] .rm-icon {
      background: var(--status-primary-surface-l1);
      box-shadow: inset 0 0 0 1px rgba(56,123,255,0.15);
    }
    #card[data-type="general"] .rm-icon svg { color: var(--status-primary-default); }
    .rm-icon svg { display: block; width: 20px; height: 20px; }

    .rm-text {
      flex: 1 1 auto; min-width: 0;
      display: flex; flex-direction: column;
      gap: var(--spacer-6);
    }
    .rm-title {
      font-size: 13px; font-weight: 600; line-height: 20px;
      color: var(--text-default);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .rm-msg {
      font-size: 11px; line-height: 16px;
      color: var(--text-secondary);
      overflow: hidden; text-overflow: ellipsis;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }

    .rm-foot {
      display: flex; align-items: center;
      justify-content: space-between;
      margin-top: var(--spacer-12);
    }
    .rm-time {
      font-size: 10px; line-height: 14px;
      color: var(--text-tertiary);
      font-variant-numeric: tabular-nums;
      display: flex; align-items: center;
      gap: var(--spacer-4);
    }
    .rm-time::before {
      content: ""; width: 4px; height: 4px;
      border-radius: var(--radius-full);
      background: var(--text-tertiary);
    }
    .rm-ok {
      background: var(--bg-brand);
      border: none; color: var(--text-onbrand);
      font-family: inherit; font-size: 11px; font-weight: 600;
      line-height: 1; padding: 7px 14px;
      border-radius: var(--radius-6);
      cursor: pointer;
      transition: background 120ms ease, transform 80ms ease;
    }
    .rm-ok:hover { background: var(--bg-brand-hover); }
    .rm-ok:active { transform: scale(0.96); }

    .rm-progress {
      position: absolute; left: 0; right: 0; bottom: 0;
      height: 2px;
      background: var(--border-neutral-l1);
      overflow: hidden;
    }
    .rm-progress::after {
      content: ""; display: block; height: 100%; width: 100%;
    }
    #card[data-type="water"] .rm-progress::after { background: var(--bg-brand); }
    #card[data-type="sedentary"] .rm-progress::after { background: var(--status-alert-default); }
    #card[data-type="pomodoro"] .rm-progress::after { background: var(--status-warning-default); }
    #card[data-type="general"] .rm-progress::after { background: var(--status-primary-default); }
    #card.timing .rm-progress::after {
      animation: rm-countdown 10s linear forwards;
    }
    @keyframes rm-countdown {
      from { width: 100%; }
      to { width: 0%; }
    }
  </style>
</head>
<body>
  <div id="card">
    <div class="rm-inner">
      <div class="rm-top">
        <div class="rm-icon"><svg id="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5C12 2.5 6 9 6 14a6 6 0 0 0 12 0c0-5-6-11.5-6-11.5z"/></svg></div>
        <div class="rm-text">
          <div class="rm-title" id="title"></div>
          <div class="rm-msg" id="msg"></div>
        </div>
      </div>
      <div class="rm-foot">
        <span class="rm-time" id="time"></span>
        <button class="rm-ok" id="ok">知道了</button>
      </div>
    </div>
    <div class="rm-progress"></div>
  <div>
  <script src="./js/reminder.js"></script>
  <!-- 主题快照：拉取 get_theme + 监听 theme://updated（与主窗口方案/主题色保持一致） -->
  <script type="module">
    import { applyThemeSnapshot } from "./js/theme.js";
    applyThemeSnapshot(document).catch((e) => console.warn("[reminder] 主题快照失败", e));
  </script>
</body>
</html>
