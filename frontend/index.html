<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DeskOverlay — 桌面工作台</title>
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <!-- 全屏覆盖背景：工作台的真实画布背景（不穿透，盖住桌面） -->
  <div id="desktop-backdrop"></div>

  <!-- 工作台画布：承载所有面板；普通全屏窗口，面板外点击由窗口自身处理 -->
  <div id="workspace" aria-label="DeskOverlay 工作台"></div>

  <!-- 快速指令条 (Spotlight 风格) -->
  <div id="command-bar" class="command-bar" hidden>
    <div class="cb-input-row">
      <svg class="cb-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
        <path fill="currentColor" d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14"/>
      </svg>
      <input id="cb-input" type="text" placeholder="输入指令或搜索…  (Ctrl/Cmd+Space 唤起)" autocomplete="off" spellcheck="false" />
      <kbd class="cb-esc">Esc</kbd>
    </div>
    <ul id="cb-results" class="cb-results"></ul>
  </div>

  <!-- 模式指示徽标 -->
  <div id="mode-badge" class="mode-badge" title="当前工作模式"></div>

  <!-- 右下角工具簇 -->
  <div id="dock" class="dock">
    <button class="dock-btn" id="dock-cmd" title="快速指令 (Ctrl/Cmd+Space)">⌘</button>
    <button class="dock-btn" id="dock-add" title="新增面板">＋</button>
    <button class="dock-btn" id="dock-reset" title="重置布局">⟳</button>
    <button class="dock-btn" id="dock-help" title="快捷键">?</button>
  </div>

  <!-- 帮助层 -->
  <div id="help-overlay" class="help-overlay" hidden>
    <div class="help-card">
      <h2>DeskOverlay 工作台</h2>
      <p class="help-sub">桌面即工作台 · 全屏覆盖，面板外点击由工作台处理</p>
      <ul class="help-list">
        <li><kbd>Ctrl</kbd>/<kbd>Cmd</kbd> + <kbd>Space</kbd> — 唤起快速指令条</li>
        <li><kbd>Esc</kbd> — 关闭指令条 / 帮助层；无任何覆盖层时退出应用</li>
        <li>拖动面板<strong>标题栏</strong>移动；拖到边缘自动吸附</li>
        <li>面板右下角拖拽<strong>缩放</strong>；标题栏 <strong>－</strong> 折叠为标题栏</li>
        <li>标题栏 <strong>🔒</strong> 锁定（禁止拖动/缩放）；<strong>✕</strong> 关闭</li>
      </ul>
      <p class="help-foot">数据本地持久化于浏览器 · 刷新后自动恢复布局</p>
      <button id="help-close" class="btn-primary">知道了</button>
    </div>
  </div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
