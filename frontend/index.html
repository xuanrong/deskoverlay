<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DeskOverlay — 桌面工作台</title>
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <!-- 全屏覆盖背景：工作台的真实画布背景（不穿透，盖住桌面） -->
  <div id="desktop-backdrop"></div>

  <!-- 应用主体：侧边导航 + 主区域 -->
  <div id="app">
    <aside id="nav">
      <div class="nav-brand">
        <span class="nav-brand-icon"><svg viewBox="0 0 24 24" width="20" height="20"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z" fill="#d4af37"/></svg></span>
        <span class="nav-brand-text">DeskOverlay</span>
      </div>
      <nav id="nav-list" aria-label="模块导航"></nav>
      <div class="nav-foot">
        <button class="nav-btn nav-quit" id="nav-quit" title="退出应用"><svg viewBox="0 0 24 24"><path d="M12 3v9"/><path d="M6.3 6.3a8 8 0 1 0 11.4 0"/></svg><span>退出</span></button>
      </div>
    </aside>
    <main id="main" aria-label="模块内容">
      <div class="main-clock" id="main-clock">
        <div class="mc-left">
          <div class="mc-time" id="mc-time">--:--:--</div>
          <div class="mc-date" id="mc-date"></div>
        </div>
        <div class="mc-reminders" id="mc-reminders"></div>
      </div>
      <div id="view-container"></div>
    </main>
  </div>

  <!-- 快速指令条 (Spotlight 风格) -->
  <div id="command-bar" class="command-bar" hidden>
    <div class="cb-input-row">
      <svg class="cb-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
        <path fill="currentColor" d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14"/>
      </svg>
      <input id="cb-input" type="text" placeholder="输入指令或搜索…  (Ctrl/Cmd+Space 唤起)" autocomplete="off" spellcheck="false" />
      <kbd class="cb-esc">Esc</kbd>
    </div>
    <ul id="cb-results" class="cb-results"></ul>
  </div>

  <!-- 帮助层 -->
  <div id="help-overlay" class="help-overlay" hidden>
    <div class="help-card">
      <h2>DeskOverlay 工作台</h2>
      <p class="help-sub">侧边导航切换模块 · 全屏固定布局</p>
      <ul class="help-list">
        <li><kbd>Ctrl</kbd>/<kbd>Cmd</kbd> + <kbd>Space</kbd> — 唤起快速指令条</li>
        <li>点击左侧导航栏图标切换模块</li>
        <li><kbd>Esc</kbd> — 关闭指令条 / 帮助层；无覆盖层时退出应用</li>
      </ul>
      <p class="help-foot">数据本地持久化 · 刷新后自动恢复</p>
      <button id="help-close" class="btn-primary">知道了</button>
    </div>
  </div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
